<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 626" width="900" height="626" role="img" aria-label="도구 파이프라인. 1 진단: crawl.py → audit.json → report.py → report.html. 승인 게이트: 사람이 우선순위를 승인한다. 2 생성: generate.py → deploy/ + DEPLOY.md, 전부 초안. 배포 게이트: 사람이 검토하고 사람이 배포한다. 3 증명: verify.py deploy → verify.json, fail이 있으면 exit code 1. 14일 후. 4 재측정: 재크롤, verify.py diff, measure.py는 사람이 측정. 5 루프: drift.py compare → drift.json → next_due, 14일마다 반복.">
  <style>
    .bg   { fill: #10201C }
    .pan  { fill: #1A2B28; stroke: #2E4A44; stroke-width: 1 }
    .gate { fill: #1A2B28; stroke: #A96A00; stroke-width: 1.4; stroke-dasharray: 7 5 }
    text  { font-family: ui-sans-serif, -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", Roboto, Arial, sans-serif }
    .l1   { font-size: 13.5px; fill: #C9DCD6 }
    .l2   { font-size: 12.5px; fill: #9DB5AE }
    .note { font-size: 11.5px; fill: #7E9992 }
    .st   { font-size: 13px; font-weight: 700; fill: #E9F2EF; letter-spacing: .04em }
    .tool { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; fill: #58BBA6 }
    .file { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; fill: #C9DCD6 }
    .ar   { fill: #4E6F68 }
    .num  { font-size: 12px; font-weight: 700; fill: #FFFFFF; text-anchor: middle }
    .chip { font-size: 10.5px; font-weight: 700; fill: #10201C; letter-spacing: .04em; text-anchor: middle }
    .flow { stroke: #4E6F68; stroke-width: 1.6; fill: none }
    .lbl  { font-size: 11px; fill: #9DB5AE }
    .bad  { fill: #B3372B }
  </style>
  <defs>
    <marker id="h" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#4E6F68"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="900" height="626"/>

  <!-- 1 진단 -->
  <rect class="pan" x="24" y="20" width="828" height="64" rx="9"/>
  <circle cx="52" cy="43" r="13" fill="#0E6B5C"/><text class="num" x="52" y="47">1</text>
  <text class="l1" x="76" y="48"><tspan class="st">진단</tspan>   <tspan class="tool">crawl.py</tspan>  <tspan class="ar">→</tspan>  <tspan class="file">audit.json</tspan>  <tspan class="ar">→</tspan>  <tspan class="tool">report.py</tspan>  <tspan class="ar">→</tspan>  <tspan class="file">report.html</tspan></text>
  <text class="note" x="76" y="68">자바스크립트 없이 받은 HTML만 본다. 판정할 수 없는 칸은 “미확인”으로 남는다.</text>
  <path class="flow" d="M58,84 L58,102" marker-end="url(#h)"/>

  <!-- 승인 게이트 -->
  <rect class="gate" x="24" y="104" width="828" height="48" rx="9"/>
  <rect x="40" y="118" width="52" height="20" rx="10" fill="#A96A00"/>
  <text class="chip" x="66" y="132">사람</text>
  <text class="l2" x="106" y="133">우선순위를 승인받는다 — 승인 전에는 아무것도 생성하지 않는다.</text>
  <path class="flow" d="M58,152 L58,170" marker-end="url(#h)"/>

  <!-- 2 생성 -->
  <rect class="pan" x="24" y="172" width="828" height="84" rx="9"/>
  <circle cx="52" cy="193" r="13" fill="#0E6B5C"/><text class="num" x="52" y="197">2</text>
  <text class="l1" x="76" y="198"><tspan class="st">생성</tspan>   <tspan class="tool">generate.py</tspan>  <tspan class="ar">→</tspan>  <tspan class="file">deploy/</tspan>  +  <tspan class="file">DEPLOY.md</tspan></text>
  <text class="l2" x="76" y="220"><tspan class="file">robots.txt</tspan> · <tspan class="file">sitemap.xml</tspan> · <tspan class="file">llms.txt</tspan> · <tspan class="file">jsonld/</tspan> · <tspan class="file">meta-draft.csv</tspan></text>
  <text class="note" x="76" y="240">전부 초안이다. 모르는 값은 지어내지 않고 <tspan class="file">&lt;&lt;TODO: …&gt;&gt;</tspan>로 남는다.</text>
  <path class="flow" d="M58,256 L58,274" marker-end="url(#h)"/>

  <!-- 배포 게이트 -->
  <rect class="gate" x="24" y="276" width="828" height="48" rx="9"/>
  <rect x="40" y="290" width="52" height="20" rx="10" fill="#A96A00"/>
  <text class="chip" x="66" y="304">사람</text>
  <text class="l2" x="106" y="305">사람이 검토하고 사람이 배포한다 — 스킬은 프로덕션에 직접 올리지 않는다.</text>
  <path class="flow" d="M58,324 L58,342" marker-end="url(#h)"/>

  <!-- 3 증명 -->
  <rect class="pan" x="24" y="344" width="828" height="64" rx="9"/>
  <circle cx="52" cy="367" r="13" fill="#0E6B5C"/><text class="num" x="52" y="371">3</text>
  <text class="l1" x="76" y="372"><tspan class="st">증명</tspan>   <tspan class="tool">verify.py deploy</tspan>  <tspan class="ar">→</tspan>  <tspan class="file">verify.json</tspan>  +  <tspan class="file">VERIFY.md</tspan></text>
  <text class="note" x="76" y="392">라이브를 다시 받아 항목별로 판정한다. <tspan class="bad">fail이 하나라도 있으면 exit code 1.</tspan></text>
  <path class="flow" d="M58,408 L58,436" marker-end="url(#h)"/>
  <text class="lbl" x="74" y="428">14일 후</text>

  <!-- 4 재측정 -->
  <rect class="pan" x="24" y="438" width="828" height="84" rx="9"/>
  <circle cx="52" cy="459" r="13" fill="#0E6B5C"/><text class="num" x="52" y="463">4</text>
  <text class="l1" x="76" y="464"><tspan class="st">재측정</tspan>   <tspan class="tool">crawl.py</tspan> 재크롤  <tspan class="ar">→</tspan>  <tspan class="tool">verify.py diff</tspan></text>
  <text class="l2" x="76" y="486"><tspan class="tool">measure.py</tspan> form <tspan class="ar">→</tspan> [ 비로그인 창으로 사람이 측정 ] <tspan class="ar">→</tspan> import <tspan class="ar">→</tspan> report <tspan class="ar">→</tspan> <tspan class="file">summary.json</tspan></text>
  <text class="note" x="76" y="506">생성 답변은 매번 다르다 — 같은 질문을 5~10회 반복하고 N회 중 몇 회로 적는다.</text>
  <path class="flow" d="M58,522 L58,540" marker-end="url(#h)"/>

  <!-- 5 루프 -->
  <rect class="pan" x="24" y="542" width="828" height="64" rx="9"/>
  <circle cx="52" cy="565" r="13" fill="#0E6B5C"/><text class="num" x="52" y="569">5</text>
  <text class="l1" x="76" y="570"><tspan class="st">루프</tspan>   <tspan class="tool">drift.py compare</tspan>  <tspan class="ar">→</tspan>  <tspan class="file">drift.json</tspan>  +  <tspan class="file">DRIFT.md</tspan>  <tspan class="ar">→</tspan>  <tspan class="file">next_due</tspan></text>
  <text class="note" x="76" y="590">회귀가 있으면 exit 1. 완료 조건은 “고쳤다”가 아니라 <tspan class="file">next_due</tspan>가 존재하는 것이다.</text>

  <!-- 되돌이 -->
  <path class="flow" d="M852,574 L874,574 L874,480 L854,480" marker-end="url(#h)"/>
  <text class="lbl" x="888" y="527" text-anchor="middle" transform="rotate(-90 888 527)">14일마다 반복</text>
</svg>
