<h1>작성 중 문서</h1>
<p>이 페이지는 아직 공개하지 않은 초안이다. 스테이징에서 넘어온 noindex가 그대로 남아 있는 상황을 재현하려고 일부러 남겼다.</p>
<p>진단 도구는 이 페이지를 noindex로 잡아내야 하고, 사이트맵 생성기는 이 URL을 사이트맵에서 빼야 한다. 두 동작이 통합 테스트의 확인 항목이다.</p>
<p>본문 내용은 의미가 없다. 다만 본문 글자 수가 너무 적으면 THIN_TEXT 판정이 따로 붙으므로, 판정을 흔들지 않을 만큼의 문장을 채워 둔다.</p>
