<h1>계약 절차</h1>
<p>계약은 네 단계로 진행한다. 신청서 접수, 서류 심사, 계약서 날인, 차량 인수 순이다. 접수부터 인수까지 영업일 기준 5일이 걸린다 (2026-01 기준).</p>
<p>준비 서류는 사업자등록증 사본과 대표자 신분증 사본 두 가지다. 법인 명의 계약이면 법인 인감증명서가 추가로 필요하다. 서류가 모두 갖춰진 뒤에야 심사가 시작된다.</p>
<p>차량 인수는 지정 지점에서 하거나 사업장으로 탁송받을 수 있다. 탁송비는 거리에 따라 달라지므로 계약서에 금액을 명시한 뒤에 진행한다.</p>
